[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibcheck"
version = "0.1.0"
description = "Verify the integrity of every reference in a BibTeX file."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bibcheck contributors" }]
keywords = ["bibtex", "citations", "crossref", "retraction", "latex", "pdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]
dependencies = [
    "bibtexparser>=2.0.0",
    "httpx>=0.27",
    "rich>=13.7",
    # Pure Python, no binary or system dependencies, so reading references out
    # of a paper PDF works everywhere the rest of bibcheck does.
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    # Only used to regenerate tests/data/pdf/paper.pdf; the committed fixture
    # means the suite itself does not need it.
    "reportlab>=4.0",
]

[project.scripts]
bibcheck = "bibcheck.cli:main"

[project.urls]
Homepage = "https://github.com/glassgotlazy/bibchecker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bibcheck = ["py.typed"]

[tool.vercel]
entrypoint = "app:app"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "app.py"]
warn_unreachable = true
# A one-off script that regenerates a committed fixture, not library code.
exclude = "tests/data/"

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
